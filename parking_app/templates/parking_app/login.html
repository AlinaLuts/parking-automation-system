<!-- parking_app/templates/parking_app/login.html -->
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід до системи - Паркінг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffb286 0%, #fc7639 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }
        
        .login-header {
            background:#ff6505;
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .login-header p {
            opacity: 0.9;
            font-size: 0.95rem;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .login-form .form-group {
            margin-bottom: 25px;
        }
        
        .login-form label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .login-form input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            outline: none;
        }
        
        .login-form input:focus {
            border-color: #fc5c27;
        }
        
        .login-form input::placeholder {
            color: #aaa;
        }
        
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e5ac70 0%, #ff4805 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: #ffeaea;
            color: #e74c3c;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #e74c3c;
            font-size: 0.95rem;
        }
        
        .guest-login {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }
        
        .guest-login p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }
        
        .btn-guest {
            display: inline-block;
            padding: 12px 25px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-guest:hover {
            background: #667eea;
            color: white;
        }
        
        .back-home {
            text-align: center;
            margin-top: 25px;
        }
        
        .back-home a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .back-home a:hover {
            text-decoration: underline;
        }
        
        .login-footer {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            color: #666;
            font-size: 0.85rem;
            border-top: 1px solid #eee;
        }
        
        .role-info {
            background: #f0f7ff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #555;
        }
        
        .role-info h4 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 1rem;
        }
        
        .role-info ul {
            padding-left: 20px;
            margin-top: 8px;
        }
        
        .role-info li {
            margin-bottom: 5px;
        }
        
        @media (max-width: 480px) {
            .login-container {
                border-radius: 15px;
            }
            
            .login-header {
                padding: 30px 20px;
            }
            
            .login-body {
                padding: 30px 20px;
            }
            
            .login-header h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Вхід до системи</h1>
            <p>Система автоматизації паркінгу бізнес-центру</p>
        </div>
        
        <div class="login-body">
            {% if error %}
                <div class="error-message">
                     {{ error }}
                </div>
            {% endif %}
            
            <form method="post" class="login-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="identifier"> Email або номер телефону</label>
                    <input type="text" 
                           id="identifier" 
                           name="identifier" 
                           placeholder="example@company.com або +380501234567" 
                           required
                           autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           placeholder="Введіть ваш пароль" 
                           required>
                </div>
                
                <button type="submit" class="btn-login">
                    Увійти до системи
                </button>
            </form>
            
            <div class="guest-login">
                <p>Ви гість або відвідувач?</p>
                <a href="{% url 'parking_app:guest_login' %}" class="btn-guest">
                    Увійти по номеру телефону
                </a>
            </div>
            
            
            <div class="back-home">
                <a href="{% url 'parking_app:home' %}">
                    ← Повернутись на головну
                </a>
            </div>
        </div>
        
        <div class="login-footer">
            
        </div>
    </div>
</body>
</html>
